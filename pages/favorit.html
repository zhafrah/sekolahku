<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekolah Favorit | SEKOLAHKU</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <a href="../indeks.html" class="logo">
        <span class="logo-icon">S</span>
        <span>SEKOLAH<span class="logo-blue">KU</span></span>
    </a>

    <nav class="nav-menu">
        <a href="../indeks.html" class="nav-link">Beranda</a>
        <a href="sekolah.html" class="nav-link">Daftar Sekolah</a>
        <a href="perbandingan.html" class="nav-link">Perbandingan</a>
        <a href="rekomendasi.html" class="nav-link">Rekomendasi</a>
        <a href="favorit.html" class="nav-link active">Favorit</a>
    </nav>
</header>

<main class="page-container">
    <section class="page-heading">
        <span class="eyebrow">KOLEKSI PILIHANMU</span>
        <h1>Sekolah <span class="logo-blue">Favorit</span></h1>
        <p>Simpan sekolah yang menarik agar mudah ditemukan kembali.</p>
    </section>

    <section class="favorites-panel">
        <form id="formFavorit">
            <label for="namaFavorit">Nama sekolah</label>
            <input
                id="namaFavorit"
                type="text"
                placeholder="Contoh: SMA Nusantara"
                required
            >

            <label for="jenisFavorit">Jenjang</label>
            <select id="jenisFavorit" required>
                <option value="SMA">SMA</option>
                <option value="SMK">SMK</option>
            </select>

            <button type="submit" class="btn-primary">
                + Simpan Favorit
            </button>
        </form>

        <div id="daftarFavorit" aria-live="polite"></div>
    </section>

    <p class="note">
        Favorit tersimpan di browser perangkat ini, bukan di akun online.
    </p>
</main>

<footer class="footer">
    <p>© 2026 SEKOLAHKU. Semua hak dilindungi.</p>
</footer>

<script src="js/script.js"></script>
<script>
const kunciFavorit = "sekolahku_favorit";

function ambilFavorit() {
    try {
        return JSON.parse(localStorage.getItem(kunciFavorit)) || [];
    } catch {
        return [];
    }
}

function tampilkanFavorit() {
    const daftar = document.getElementById("daftarFavorit");
    const favorit = ambilFavorit();

    if (favorit.length === 0) {
        daftar.innerHTML = "<p>Belum ada sekolah favorit. Tambahkan sekolah melalui formulir di atas.</p>";
        return;
    }

    daftar.innerHTML = favorit.map((item, index) => 
        <article class="feature-card">
            <h3>${escapeHTML(item.nama)}</h3>
            <p>Jenjang: ${escapeHTML(item.jenjang)}</p>
            <button type="button" class="btn-primary"
                data-hapus="${index}">
                Hapus dari Favorit
            </button>
        </article>
    ).join("");
}

function escapeHTML(teks) {
    const elemen = document.createElement("span");
    elemen.textContent = teks;
    return elemen.innerHTML;
}

document.getElementById("formFavorit")
    .addEventListener("submit", function(event) {
        event.preventDefault();

        const nama = document.getElementById("namaFavorit").value.trim();
        const jenjang = document.getElementById("jenisFavorit").value;

        if (!nama) return;

        const favorit = ambilFavorit();

        if (favorit.some(item =>
            item.nama.toLowerCase() === nama.toLowerCase() &&
            item.jenjang === jenjang
        )) {
            alert("Sekolah ini sudah ada di daftar favorit.");
            return;
        }

        favorit.push({ nama, jenjang });
        localStorage.setItem(kunciFavorit, JSON.stringify(favorit));

        this.reset();
        tampilkanFavorit();
    });

document.getElementById("daftarFavorit")
    .addEventListener("click", function(event) {
        const tombol = event.target.closest("[data-hapus]");
        if (!tombol) return;

const favorit = ambilFavorit();
        favorit.splice(Number(tombol.dataset.hapus), 1);
        localStorage.setItem(kunciFavorit, JSON.stringify(favorit));
        tampilkanFavorit();
    });

tampilkanFavorit();
</script>

</body>
</html>
